<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>StubDeck - Sign in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400&display=swap"
          rel="stylesheet"/>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: #FAFAFA; font-family: 'Geist', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .card {
            background: #fff; border: 1px solid #E4E4E7;
            border-radius: 12px; padding: 36px 40px;
            width: 100%; max-width: 380px;
            box-shadow: 0 4px 24px rgb(0 0 0/.06);
        }
        .logo {
            display: flex; align-items: center; gap: 10px; margin-bottom: 28px;
        }
        .logo-mark {
            width: 32px; height: 32px; border-radius: 7px;
            background: #2563EB; display: grid; place-items: center;
        }
        .logo-mark svg { width: 16px; height: 16px; }
        .logo-name { font-size: 15px; font-weight: 600; color: #09090B; }
        h1 { font-size: 18px; font-weight: 600; margin-bottom: 6px; color: #09090B; }
        .sub { font-size: 13px; color: #A1A1AA; margin-bottom: 24px; }
        .field { margin-bottom: 14px; }
        label { display: block; font-size: 12px; font-weight: 600; color: #52525B; margin-bottom: 5px; }
        input {
            width: 100%; padding: 9px 12px;
            border: 1px solid #E4E4E7; border-radius: 8px;
            font-size: 13.5px; font-family: 'Geist', sans-serif;
            color: #09090B; outline: none;
            transition: border-color .12s, box-shadow .12s;
        }
        input:focus {
            border-color: #2563EB;
            box-shadow: 0 0 0 3px rgb(37 99 235/.1);
        }
        .btn {
            width: 100%; padding: 9px;
            background: #2563EB; color: #fff;
            border: none; border-radius: 8px;
            font-size: 14px; font-weight: 500;
            font-family: 'Geist', sans-serif;
            cursor: pointer; margin-top: 6px;
            transition: background .1s;
        }
        .btn:hover { background: #1D4ED8; }
        .error {
            background: #FEF2F2; border: 1px solid #FECACA;
            color: #7F1D1D; border-radius: 8px;
            padding: 10px 13px; font-size: 13px; margin-bottom: 16px;
        }
        .hint {
            font-size: 11.5px; color: #A1A1AA;
            text-align: center; margin-top: 20px;
            font-family: 'Geist Mono', monospace;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="logo">
        <div class="logo-mark">
            <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M2 4h12M2 8h8M2 12h10" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
        </div>
        <span class="logo-name">StubDeck</span>
    </div>

    <h1>Sign in</h1>
    <p class="sub">Use your corporate AD credentials</p>

    <div th:if="${errorMessage}" class="error" th:text="${errorMessage}"></div>
    <div th:if="${param.error != null and errorMessage == null}" class="error">
        Authentication failed. Please try again.
    </div>
    <div th:if="${param.logout}" class="error" style="background:#F0FDF4;border-color:#BBF7D0;color:#14532D">
        You have been signed out successfully.
    </div>

    <form th:action="@{/login}" method="post">
        <div class="field">
            <label for="username">Username</label>
            <input type="text" id="username" name="username"
                   placeholder="e.g. john.doe" autocomplete="username" autofocus>
        </div>
        <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   placeholder="••••••••" autocomplete="current-password">
        </div>
        <button type="submit" class="btn">Sign in</button>
    </form>

    <p class="hint">corporate AD authentication</p>
</div>
</body>
</html>
