services:
  wiremock:
    image: wiremock/wiremock:3.13.2
    container_name: wiremock-local
    ports:
      - "8091:8080"
    volumes:
      - ./wiremock-local:/home/wiremock
    environment:
      WIREMOCK_OPTIONS: "--verbose"

  wiremock-2:
    image: wiremock/wiremock:3.13.2
    container_name: wiremock-local-2
    ports:
      - "8093:8080"
    volumes:
      - ./wiremock-local-2:/home/wiremock
    environment:
      WIREMOCK_OPTIONS: "--verbose"
